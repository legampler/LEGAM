<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGAM G - Bio Links</title>
    <meta name="description" content="Kumpulan tautan sosial media LEGAM G.">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Efek Latar Belakang -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="container">
        <!-- Bagian Profil -->
        <header class="profile-header">
            <div class="avatar-container">
                <div class="glow-ring"></div>
                <img src="avatar.png" alt="LEGAM" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=Legam+G&background=random&size=150'">
            </div>
            <h1 class="username">LEGAM</h1>
            <p class="subtitle">G</p>
        </header>

        <!-- Bagian Link -->
        <section class="links-container">
            <a href="https://www.instagram.com/rifkyrchmwn" class="link-btn instagram" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram icon"></i>
                <span class="btn-text">Instagram</span>
            </a>
            
            <a href="https://www.tiktok.com/@legamtwoo" class="link-btn tiktok" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-tiktok icon"></i>
                <span class="btn-text">TikTok</span>
            </a>
            
            <a href="https://sociabuzz.com/remboww59" class="link-btn sociabuzz" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-coins icon"></i>
                <span class="btn-text">Sociabuzz</span>
            </a>
        </section>

        <!-- Bagian Pemutar Musik -->
        <section class="music-player">
            <div class="player-info">
                <i class="fas fa-music note-icon"></i>
                <div class="song-details">
                    <span class="song-title">Hysteria</span>
                    <span class="song-artist">Muse</span>
                </div>
            </div>
            
            <div class="controls-wrapper">
                <button id="playBtn" class="play-pause-btn" aria-label="Play/Pause">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-head"></div>
                    </div>
                </div>
                
                <span class="time-display" id="timeDisplay">0:00</span>
            </div>

            <!-- Kontrol Volume -->
            <div class="volume-wrapper">
                <button id="muteBtn" class="mute-btn" aria-label="Mute/Unmute">
                    <i class="fas fa-volume-up" id="muteIcon"></i>
                </button>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
            
            <!-- Elemen Audio MP3 Lokal -->
            <audio id="audioElement" src="Muse - Hysteria [Official Music Video] - (320 Kbps).mp3"></audio>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 LEGAM &bull; My Profile</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
